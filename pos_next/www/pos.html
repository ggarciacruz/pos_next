  <meta http-equiv="Expires" content="0" />
  <script>
    // Self-healing guard against stale PWA Service Worker / cached HTML referencing old Vite chunk hashes (404)
    (function () {
      function recoverFromStaleChunk(targetUrl) {
        if (!navigator.onLine) return;
        try {
          var lastReload = Number(sessionStorage.getItem("pos_asset_404_reload") || "0");
          var now = Date.now();
          if (now - lastReload < 15000) return; // Prevent reload loops
          sessionStorage.setItem("pos_asset_404_reload", String(now));
        } catch (e) {}

        var cleanup = Promise.resolve();
        if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
          cleanup = navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            })
            .catch(function () {});
        }
        if ("caches" in window && window.caches.keys) {
          cleanup = cleanup
            .then(function () { return window.caches.keys(); })
            .then(function (keys) {
              return Promise.all(
                keys.map(function (k) {
                  if (k.indexOf("workbox") !== -1 || k.indexOf("pos-page") !== -1 || k.indexOf("pos-assets") !== -1) {
                    return window.caches.delete(k);
                  }
                  return Promise.resolve();
                })
              );
            })
            .catch(function () {});
        }
        cleanup.finally(function () {
          var url = new URL(window.location.href);
          url.searchParams.set("_v", String(Date.now()));
          window.location.replace(url.toString());
        });
      }

      window.addEventListener(
        "error",
        function (event) {
          var el = event && event.target;
          if (!el) return;
          var src = el.src || el.href || "";
          if (src.indexOf("/assets/pos_next/pos/assets/") !== -1) {
            recoverFromStaleChunk(src);
          }
        },
        true
      );

      window.addEventListener("vite:preloadError", function (event) {
        event.preventDefault();
        recoverFromStaleChunk("vite:preloadError");
      });
    })();
  </script>
